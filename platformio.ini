; ============================================================================
;  MoniRes_ESP32 - Etapa 1 (estrutura independente)
;  Placa: ESP32 DevKit V1 30 pinos (ESP32-WROOM-32, CH340)
;  Sensor: QDY30A em GPIO34 | Display: TM1637 (CLK=GPIO22, DIO=GPIO23)
;  Botao: GPIO16 (ativo em nivel ALTO)
;
;  SELECAO DE AMBIENTE: exclusivamente include/config.h (TEST_MODE).
;  Nao ha -D de modo aqui nem em nenhum outro arquivo: os ambientes do
;  PlatformIO nao criam uma segunda chave de selecao TESTE/PRODUCAO.
;
;  O projeto original (Monitora_Reserv, ESP8266) permanece intocado. Este e um
;  projeto independente, com Git proprio.
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; LittleFS com a tabela no_ota.csv: 2 MB para a aplicacao e 1,875 MB para o
; sistema de arquivos. O firmware NUNCA formata o LittleFS automaticamente.
; Em uma placa nova, envie a imagem uma vez com `pio run -t uploadfs`.
; A pasta data/ fica vazia (so o .gitkeep) porque a fila, o historico e os
; alertas criam os arquivos em tempo de execucao.
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv

lib_deps =
    ; Display de 6 digitos. O registro do PlatformIO ainda publica apenas a
    ; versao 1.1.0 (4 digitos), por isso a tag do repositorio, que inclui
    ; o cabecalho TM1637TinyDisplay6.h.
    https://github.com/jasonacox/TM1637TinyDisplay/archive/refs/tags/v1.12.2.zip
    ; MQTT usado pelo modulo thingsboard.
    knolleary/PubSubClient @ 2.8
    ; JSON da Bot API do Telegram (versao fixada, decidida para o projeto).
    bblanchon/ArduinoJson @ 6.21.5

; O codigo existente usa `if constexpr`, que exige C++17. O builder do core
; Arduino 2.0.17 adiciona -std=gnu++11; o unflag remove essa opcao antes de
; aplicar as flags abaixo.
build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; chat.id e update_id do Telegram precisam de 64 bits (grupos -100...).
    ; E o padrao do ArduinoJson em plataformas de 32 bits, fixado aqui para
    ; nao depender de deteccao automatica.
    -DARDUINOJSON_USE_LONG_LONG=1

; tools/host_test nao e compilado pelo PlatformIO (o firmware usa apenas src/).
